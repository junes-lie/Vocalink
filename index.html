<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121116" />
  <title>보컬 궁합 기반 듀엣 MVP</title>
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .voice-card:not(.duet-preview-card) .voice-card-content { height:164px; padding:12px 14px 14px; display:flex; flex-direction:column; align-items:stretch; }

  <div id="app" class="app-shell" aria-live="off"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
